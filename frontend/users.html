<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — HireHub Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <div id="topbar"></div>
    <main class="admin-content" style="padding-top:96px">
      <div id="alertBox"></div>
      <div id="content"><div class="loading">Loading users…</div></div>
    </main>
  </div>

  <!-- Edit user modal -->
  <div class="modal-backdrop" id="userModal" style="display:none">
    <div class="modal sm">
      <div class="modal-head">
        <div class="t">
          <span class="m-ico"><span class="msi">manage_accounts</span></span>
          <div>
            <h2 id="userModalTitle">Edit User</h2>
            <p>Update profile details and platform role.</p>
          </div>
        </div>
        <button class="icon-btn" id="userModalClose" aria-label="Close modal"><span class="msi">close</span></button>
      </div>
      <div class="modal-body">
        <div id="userModalAlert"></div>
        <form id="userForm" style="display:flex;flex-direction:column;gap:16px">
          <input type="hidden" id="editUserId" />
          <div class="field">
            <label for="uName">Name</label>
            <input class="input fill" id="uName" maxlength="100" required />
          </div>
          <div class="field">
            <label for="uEmail">Email</label>
            <input class="input fill" id="uEmail" type="email" required />
          </div>
          <div class="field">
            <label for="uRole">Role</label>
            <div class="select-wrap" style="width:100%">
              <select class="input fill" id="uRole">
                <option value="user">user — job seeker</option>
                <option value="admin">admin — full access</option>
              </select>
              <span class="msi chev">expand_more</span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" id="userModalCancel">Cancel</button>
        <button class="btn btn-primary" id="userModalSubmit" form="userForm" type="submit">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete user confirmation -->
  <div class="modal-backdrop center" id="userDeleteModal" style="display:none">
    <div class="modal sm delete-modal">
      <div class="warn-ico"><span class="msi">warning</span></div>
      <h3>Delete User Account?</h3>
      <p>
        Are you sure you want to delete <b id="deleteTargetUser" style="color:var(--ink)">""</b>?
        Their applications will be removed as well. This action cannot be undone.
      </p>
      <div class="row">
        <button class="btn btn-secondary" id="userDeleteCancel">Cancel</button>
        <button class="btn btn-danger" id="userDeleteConfirm">Delete User</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
